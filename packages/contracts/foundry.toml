[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 20_000
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

[fmt]
line_length = 100
int_types = "long"
quote_style = "double"
multiline_func_header = "params_first"
wrap_comments = true

[fuzz]
runs = 512
max_test_rejects = 131072

[invariant]
runs = 256
depth = 64
fail_on_revert = false
